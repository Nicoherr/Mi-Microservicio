name: CI/CD Pipeline - DevOps Security, Quality Gate & Deployment

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  packages: write

jobs:
  pipeline:
    name: Continuous Integration, Security & Deployment Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: 2. Run Tests & Generate JaCoCo Coverage Report
        run: gradle test jacocoTestReport --info

      - name: Verify JaCoCo Coverage Report Exists
        run: ls -lh build/reports/jacoco/test/jacocoTestReport.xml

      - name: Upload JaCoCo Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/jacocoTestReport.xml

      - name: Verify SonarCloud Config & Secret
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR CRITICO: El secreto SONAR_TOKEN esta vacio en GitHub Secrets!"
            exit 1
          fi
          echo "SONAR_TOKEN detectado correctamente"
          grep -E "^sonar\.(projectKey|organization)=" sonar-project.properties

      - name: 3. SonarCloud Analysis & Quality Gate Enforcement
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: 4. Snyk Dependency Security Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --severity-threshold=high --fail-on=upgradable
          snyk monitor || true

      - name: 5. Build Docker Image
        run: docker build -t product-service:latest -t ghcr.io/nicoherr/mi-microservicio:latest .

      - name: Snyk Container Image Security Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test product-service:latest --file=Dockerfile --severity-threshold=high --fail-on=upgradable || true

      - name: 6. Simulated Deployment with Docker Compose (App + Prometheus + Grafana)
        run: docker compose up -d --build

      - name: Verify Microservice & Grafana Health (HTTP 200 OK)
        run: |
          for i in {1..30}; do
            APP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
            GRAFANA_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health || true)
            if [ "$APP_STATUS" -eq 200 ] && [ "$GRAFANA_STATUS" -eq 200 ]; then
              echo "¡Éxito! Microservicio (200) y Grafana (200) operativos."
              exit 0
            fi
            echo "Intento $i/30: App=$APP_STATUS, Grafana=$GRAFANA_STATUS. Reintentando en 3s..."
            sleep 3
          done
          docker compose logs
          exit 1

      - name: Verify REST API & Prometheus Metrics
        run: |
          curl -f -s http://localhost:8080/api/v1/products
          curl -f -s http://localhost:8080/actuator/prometheus | head -n 10

      - name: Clean Up Docker Compose Environment
        if: always()
        run: docker compose down -v

      - name: 7. Push Image to GHCR & Deploy to AWS Kubernetes (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/nicoherr/mi-microservicio:latest

          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_KEY" ]; then
            echo "AVISO: Secretos EC2_HOST/EC2_SSH_KEY aún no configurados. Despliegue en Kubernetes AWS omitido hasta levantar EC2."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/aws_k8s.pem
          chmod 600 ~/.ssh/aws_k8s.pem
          scp -o StrictHostKeyChecking=no -i ~/.ssh/aws_k8s.pem -r k8s "$EC2_USER@$EC2_HOST:~/"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/aws_k8s.pem "$EC2_USER@$EC2_HOST" << 'ENDSSH'
            kubectl apply -f ~/k8s/
            kubectl rollout restart deployment/product-service
            kubectl rollout status deployment/product-service --timeout=120s
            kubectl get pods,svc
          ENDSSH
