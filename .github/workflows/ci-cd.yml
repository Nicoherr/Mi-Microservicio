name: CI/CD Pipeline - DevOps Security, Quality Gate & Deployment

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  pipeline:
    name: Continuous Integration, Security & Deployment Pipeline
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Checkout del código y configuración de Java 17 + Gradle 8.7 (sin gradlew)
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      # Paso 2: Compilación, Pruebas Unitarias y Generación de Reporte JaCoCo
      - name: 2. Run Tests & Generate JaCoCo Coverage Report
        run: gradle test jacocoTestReport --info

      - name: Upload JaCoCo Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/jacocoTestReport.xml

      # Paso 3: Análisis con SonarCloud (Bloqueante si falla el Quality Gate)
      - name: 3. SonarCloud Analysis & Quality Gate Enforcement
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      # Paso 4: Escaneo de Seguridad de Dependencias con Snyk
      - name: 4. Snyk Dependency Security Scan
        uses: snyk/actions/gradle@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # Paso 5: Construcción de Imagen Docker y Escaneo de Contenedor con Snyk
      - name: 5. Build Docker Image
        run: docker build -t product-service:latest .

      - name: Snyk Container Image Security Scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: product-service:latest
          args: --severity-threshold=high

      # Paso 6: Despliegue Simulado con Docker Compose y Verificación de Endpoint Health (HTTP 200)
      - name: 6. Simulated Deployment with Docker Compose
        run: docker compose up -d --build

      - name: Verify Microservice Health (HTTP 200 OK)
        run: |
          echo "Esperando a que el microservicio inicie correctamente..."
          for i in {1..30}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "¡Éxito! El microservicio respondió con HTTP 200 OK en /actuator/health"
              exit 0
            fi
            echo "Intento $i/30: Estado HTTP = $HTTP_STATUS. Reintentando en 3s..."
            sleep 3
          done
          echo "ERROR: El microservicio no respondió HTTP 200 a tiempo."
          docker compose logs product-service
          exit 1

      - name: Verify REST API Response
        run: |
          echo "Probando endpoint REST GET /api/v1/products:"
          curl -f -s http://localhost:8080/api/v1/products

      - name: Clean Up Docker Compose Environment
        if: always()
        run: docker compose down -v
