name: CI/CD Pipeline - DevOps Security, Quality Gate & Deployment

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  pipeline:
    name: Continuous Integration & Security Pipeline
    runs-on: ubuntu-latest
    steps:
      # Paso 1: Checkout del código y configuración de JDK 17
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      # Paso 2: Compilación, Pruebas Unitarias y Cobertura JaCoCo
      - name: 2. Compile, Run Unit Tests & Generate JaCoCo Coverage
        run: |
          ./gradlew test --info
          ./gradlew jacocoTestReport

      - name: Upload JaCoCo Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/jacocoTestReport.xml

      # Paso 3: Análisis con SonarCloud (Quality Gate Block)
      - name: 3. SonarCloud Code Analysis & Quality Gate
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      # Paso 4: Escaneo de Dependencias con Snyk (Bloqueo en Vulnerabilidades Altas/Críticas)
      - name: 4. Snyk Dependency Security Scan
        uses: snyk/actions/gradle@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # Paso 5: Construcción de Imagen Docker y Escaneo de Imagen con Snyk
      - name: 5. Build Docker Image
        run: |
          docker build -t product-service:latest .

      - name: Snyk Docker Container Image Security Scan
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: product-service:latest
          args: --severity-threshold=high

      # Paso 6: Despliegue Simulado con Docker Compose y Verificación HTTP 200 con Curl
      - name: 6. Simulated Deployment with Docker Compose
        run: |
          docker compose up -d --build

      - name: Verify Microservice Health (HTTP 200 OK)
        run: |
          echo "Esperando inicio del microservicio en contenedor..."
          for i in {1..30}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || true)
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "¡Éxito! El microservicio está activo y respondió con HTTP 200 OK."
              exit 0
            fi
            echo "Intento $i/30: Estado HTTP actual: $HTTP_STATUS. Reintentando en 3s..."
            sleep 3
          done
          echo "ERROR: El microservicio no respondió con HTTP 200 a tiempo."
          docker compose logs product-service
          exit 1

      - name: Verify REST API Endpoint Response
        run: |
          echo "Verificando endpoint REST GET /api/v1/products:"
          curl -f -s http://localhost:8080/api/v1/products

      - name: Clean Up Docker Compose Environment
        if: always()
        run: docker compose down -v
