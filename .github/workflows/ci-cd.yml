name: CI/CD Pipeline - DevOps Quality Gate & Deployment

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  build-test-coverage:
    name: 1. Build, Unit Tests & JaCoCo Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Compile and Run Unit Tests
        run: ./gradlew test --info

      - name: Generate JaCoCo XML Coverage Report
        run: ./gradlew jacocoTestReport

      - name: Upload JaCoCo Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/jacocoTestReport.xml

  sonarcloud-analysis:
    name: 2. SonarCloud Code Analysis & Quality Gate Audit
    needs: build-test-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Download JaCoCo Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/

      - name: SonarCloud Scan & Quality Gate Enforcement
        uses: SonarSource/sonarcloud-github-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=product-service
            -Dsonar.organization=your-sonarcloud-org
            -Dsonar.sources=src/main/kotlin
            -Dsonar.tests=src/test/kotlin
            -Dsonar.java.binaries=build/classes/kotlin/main
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
            -Dsonar.qualitygate.wait=true

  docker-build-push:
    name: 3. Docker Image Build & Push to Docker Hub
    needs: sonarcloud-analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/product-service:latest
            ${{ secrets.DOCKER_USERNAME }}/product-service:${{ github.sha }}

  smoke-test-deployment:
    name: 4. Simulated Deployment & Health Check (Smoke Test)
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Start Environment with Docker Compose
        run: |
          docker compose up -d --build

      - name: Wait for Microservice Health Check
        run: |
          echo "Esperando a que el microservicio esté en estado UP..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8080/actuator/health | grep '"status":"UP"'; then
              echo "Microservicio iniciado correctamente y respondiendo 200 OK!"
              exit 0
            fi
            echo "Intento $i/30: Esperando respuesta del microservicio..."
            sleep 3
          done
          echo "ERROR: El microservicio no respondió en el tiempo esperado."
          docker compose logs product-service
          exit 1

      - name: Verify Microservice Endpoints with Curl
        run: |
          echo "1. Verificando Health Check endpoint (/actuator/health):"
          curl -f -s http://localhost:8080/actuator/health
          echo ""

          echo "2. Verificando REST Endpoint (/api/v1/products):"
          curl -f -s http://localhost:8080/api/v1/products
          echo ""

          echo "3. Verificando Prometheus Metrics Endpoint (/actuator/prometheus):"
          curl -f -s http://localhost:8080/actuator/prometheus | grep "products_created_total" || true

      - name: Clean up Docker Compose Environment
        if: always()
        run: docker compose down -v
