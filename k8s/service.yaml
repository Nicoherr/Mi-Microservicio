apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: default
  labels:
    app.kubernetes.io/name: product-service
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
      protocol: TCP
  selector:
    app: product-service
