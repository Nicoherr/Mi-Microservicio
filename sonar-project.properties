# ==============================================================================
# Configuración del Proyecto SonarCloud / SonarQube
# ==============================================================================

# Reemplazar con la clave de proyecto y organización en SonarCloud
sonar.projectKey=Nicoherr_Mi-Microservicio
sonar.organization=nicoherr

# Metadata del proyecto
sonar.projectName=Product Service Microservice
sonar.projectVersion=1.0.0

# Archivos de código fuente y pruebas
sonar.sources=src/main/kotlin
sonar.tests=src/test/kotlin
sonar.java.binaries=build/classes/kotlin/main

# Encoding de archivos
sonar.sourceEncoding=UTF-8

# Reporte de Cobertura JaCoCo XML y Pruebas JUnit
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
sonar.junit.reportPaths=build/test-results/test

# Quality Gate Enforcement
sonar.qualitygate.wait=true

# Exclusiones del Análisis y Cobertura
sonar.exclusions=**/*Application.kt,**/config/**,**/dto/**,**/model/**,**/entity/**,**/metrics/**
sonar.coverage.exclusions=**/*Application.kt,**/config/**,**/dto/**,**/model/**,**/entity/**,**/metrics/**
