# Metadata del proyecto
sonar.projectKey=product-service
sonar.projectName=Product Service Microservice
sonar.projectVersion=1.0.0

# Archivos de código fuente y pruebas
sonar.sources=src/main/kotlin
sonar.tests=src/test/kotlin
sonar.java.binaries=build/classes/kotlin/main

# Encoding de archivos
sonar.sourceEncoding=UTF-8

# Reporte de Cobertura JaCoCo
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Quality Gate Enforcement
sonar.qualitygate.wait=true

# Exclusiones de Análisis
sonar.coverage.exclusions=**/model/**,**/dto/**,**/config/**,**/ProductServiceApplication.kt
